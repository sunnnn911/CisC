<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에너지 놀이터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <p class="eyebrow">지속가능 에너지 탐구 프로젝트</p>
    <h1>에너지 놀이터</h1>
    <p class="subtitle">놀이기구 위 손가락 버튼을 터치해 아이들이 만드는 운동에너지를 전기로 바꿔보세요</p>

    <div class="gauge-wrap">
      <div class="gauge">
        <div class="gauge-cells" id="gaugeCells"></div>
        <div class="gauge-label">
          <span id="gaugePercent">0</span><span class="percent-sign">%</span>
        </div>
      </div>
      <p class="gauge-caption">마이크로그리드 충전량 <span id="gaugeStatus">가동 대기 중</span></p>
    </div>
  </header>

  <section class="storage-strip">
    <div class="storage-item"><span class="storage-dot cap"></span>슈퍼커패시터 순간 저장</div>
    <div class="storage-item"><span class="storage-dot ess"></span>폐배터리 ESS 장기 저장</div>
    <div class="storage-item"><span class="storage-dot grid"></span>마이크로그리드 배전</div>
  </section>

  <div class="scene-stage">

    <!-- ===================== 낮의 놀이터 풍경 ===================== -->
    <section class="scene playground-scene active" id="scenePlayground">
      <svg viewBox="0 0 1000 420" class="landscape-svg" id="playgroundSvg" preserveAspectRatio="xMidYMax meet">
        <defs>
          <linearGradient id="daySky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8FCBEA" />
            <stop offset="100%" stop-color="#EAF6E8" />
          </linearGradient>
        </defs>

        <rect x="0" y="0" width="1000" height="310" fill="url(#daySky)" />
        <circle cx="890" cy="60" r="34" class="sun" />
        <ellipse cx="150" cy="70" rx="46" ry="16" class="cloud" />
        <ellipse cx="220" cy="60" rx="34" ry="13" class="cloud" />
        <ellipse cx="600" cy="50" rx="40" ry="14" class="cloud" />
        <ellipse cx="660" cy="62" rx="26" ry="10" class="cloud" />

        <!-- 먼 산/나무 라인 -->
        <path d="M0,300 Q120,255 260,290 Q420,250 560,288 Q740,248 1000,292 L1000,300 L0,300 Z" class="hills" />

        <!-- 풍력 발전기 (양쪽) -->
        <g class="turbine-day">
          <line x1="55" y1="300" x2="55" y2="150" class="turbine-pole" />
          <g class="turbine-blades" id="dayBlades1">
            <line x1="55" y1="150" x2="55" y2="108" class="turbine-blade" />
            <line x1="55" y1="150" x2="90" y2="168" class="turbine-blade" />
            <line x1="55" y1="150" x2="20" y2="168" class="turbine-blade" />
          </g>
        </g>
        <g class="turbine-day">
          <line x1="945" y1="300" x2="945" y2="140" class="turbine-pole" />
          <g class="turbine-blades" id="dayBlades2">
            <line x1="945" y1="140" x2="945" y2="98" class="turbine-blade" />
            <line x1="945" y1="140" x2="980" y2="158" class="turbine-blade" />
            <line x1="945" y1="140" x2="910" y2="158" class="turbine-blade" />
          </g>
        </g>

        <rect x="0" y="300" width="1000" height="120" class="grass" />
        <path d="M0,300 Q500,285 1000,300" class="grass-edge" />
        <ellipse cx="500" cy="335" rx="470" ry="46" class="dirt-path" />

        <!-- 태양광 패널 지붕 (놀이터 중앙 캐노피) -->
        <g class="solar-canopy">
          <line x1="270" y1="200" x2="270" y2="300" class="canopy-post" />
          <line x1="730" y1="200" x2="730" y2="300" class="canopy-post" />
          <polygon points="250,205 750,205 780,175 220,175" class="canopy-roof" />
          <line x1="290" y1="196" x2="315" y2="181" class="canopy-line" />
          <line x1="360" y1="196" x2="385" y2="181" class="canopy-line" />
          <line x1="430" y1="196" x2="455" y2="181" class="canopy-line" />
          <line x1="500" y1="196" x2="525" y2="181" class="canopy-line" />
          <line x1="570" y1="196" x2="595" y2="181" class="canopy-line" />
          <line x1="640" y1="196" x2="665" y2="181" class="canopy-line" />
          <line x1="710" y1="196" x2="735" y2="181" class="canopy-line" />
        </g>

        <!-- 미끄럼틀 -->
        <svg x="15" y="170" width="150" height="130" viewBox="0 0 200 160" class="device-hotspot" data-device="slide">
          <polyline points="30,150 30,40 170,150" class="slide-frame" />
          <line x1="24" y1="46" x2="24" y2="150" class="slide-ladder" />
          <line x1="24" y1="60" x2="16" y2="60" class="slide-rung" />
          <line x1="24" y1="80" x2="16" y2="80" class="slide-rung" />
          <line x1="24" y1="100" x2="16" y2="100" class="slide-rung" />
          <g id="rider-slide">
            <circle cx="30" cy="30" r="8" class="rider-head" />
            <rect x="23" y="36" width="14" height="14" rx="4" class="rider-body" />
          </g>
        </svg>

        <!-- 그네 -->
        <svg x="180" y="170" width="150" height="130" viewBox="0 0 200 160" class="device-hotspot" data-device="swing">
          <line x1="30" y1="150" x2="60" y2="8" class="swing-frame" />
          <line x1="170" y1="150" x2="140" y2="8" class="swing-frame" />
          <line x1="40" y1="10" x2="160" y2="10" class="swing-bar" />
          <g id="rider-swing" class="swing-pivot">
            <line x1="0" y1="0" x2="0" y2="82" class="swing-rope" />
            <circle cx="0" cy="90" r="8" class="rider-head" />
            <rect x="-7" y="96" width="14" height="14" rx="4" class="rider-body rider-body-b" />
          </g>
        </svg>

        <!-- 시소 -->
        <svg x="345" y="170" width="150" height="130" viewBox="0 0 200 160" class="device-hotspot" data-device="seesaw">
          <polygon points="90,120 110,120 100,100" class="seesaw-pivot" />
          <g id="rider-seesaw" class="seesaw-plank">
            <line x1="20" y1="0" x2="180" y2="0" class="plank" />
            <circle cx="35" cy="-8" r="8" class="rider-head" />
            <rect x="28" y="-2" width="14" height="14" rx="4" class="rider-body" />
            <circle cx="165" cy="-8" r="8" class="rider-head rider-head-b" />
            <rect x="158" y="-2" width="14" height="14" rx="4" class="rider-body rider-body-b" />
          </g>
        </svg>

        <!-- 회전 놀이기구 -->
        <svg x="510" y="170" width="150" height="130" viewBox="0 0 200 160" class="device-hotspot" data-device="carousel">
          <circle cx="100" cy="80" r="55" class="carousel-base" />
          <circle cx="100" cy="80" r="10" class="carousel-hub" />
          <g id="rider-carousel" class="carousel-spin">
            <circle cx="100" cy="30" r="7" class="rider-head" />
            <rect x="94" y="35" width="12" height="12" rx="3" class="rider-body" />
            <circle cx="150" cy="80" r="7" class="rider-head rider-head-b" />
            <rect x="144" y="74" width="12" height="12" rx="3" class="rider-body rider-body-b" />
            <circle cx="100" cy="130" r="7" class="rider-head" />
            <rect x="94" y="119" width="12" height="12" rx="3" class="rider-body" />
            <circle cx="50" cy="80" r="7" class="rider-head rider-head-b" />
            <rect x="44" y="74" width="12" height="12" rx="3" class="rider-body rider-body-b" />
          </g>
        </svg>

        <!-- 숫자 놀이 패드 -->
        <svg x="675" y="170" width="150" height="130" viewBox="0 0 200 160" class="device-hotspot" data-device="numberpad">
          <g id="rider-numberpad">
            <rect x="45" y="45" width="46" height="46" rx="8" class="pad-tile pad-tile-a" />
            <rect x="95" y="45" width="46" height="46" rx="8" class="pad-tile pad-tile-b" />
            <rect x="45" y="95" width="46" height="46" rx="8" class="pad-tile pad-tile-c" />
            <rect x="95" y="95" width="46" height="46" rx="8" class="pad-tile pad-tile-a" />
            <text x="68" y="75" text-anchor="middle" class="pad-number">2</text>
            <text x="118" y="75" text-anchor="middle" class="pad-number">7</text>
            <text x="68" y="125" text-anchor="middle" class="pad-number">3</text>
            <text x="118" y="125" text-anchor="middle" class="pad-number">9</text>
          </g>
        </svg>

        <!-- 손잡이 회전 장치 -->
        <svg x="840" y="170" width="150" height="130" viewBox="0 0 200 160" class="device-hotspot" data-device="wheel">
          <rect x="90" y="80" width="20" height="55" class="wheel-stand" />
          <g id="rider-wheel" class="wheel-spin">
            <circle cx="100" cy="80" r="42" class="wheel-ring" />
            <line x1="100" y1="38" x2="100" y2="122" class="wheel-spoke" />
            <line x1="58" y1="80" x2="142" y2="80" class="wheel-spoke" />
            <circle cx="100" cy="80" r="9" class="wheel-hub" />
          </g>
        </svg>

        <text x="90" y="330" text-anchor="middle" class="device-label">미끄럼틀</text>
        <text x="255" y="330" text-anchor="middle" class="device-label">그네</text>
        <text x="420" y="330" text-anchor="middle" class="device-label">시소</text>
        <text x="585" y="330" text-anchor="middle" class="device-label">회전 놀이기구</text>
        <text x="750" y="330" text-anchor="middle" class="device-label">숫자 놀이 패드</text>
        <text x="915" y="330" text-anchor="middle" class="device-label">손잡이 회전 장치</text>
      </svg>

      <div class="spark-field">
        <div class="spark-layer" id="spark-slide" style="left:9%; top:56%;"></div>
        <div class="spark-layer" id="spark-swing" style="left:25.5%; top:56%;"></div>
        <div class="spark-layer" id="spark-seesaw" style="left:42%; top:56%;"></div>
        <div class="spark-layer" id="spark-carousel" style="left:58.5%; top:56%;"></div>
        <div class="spark-layer" id="spark-numberpad" style="left:75%; top:56%;"></div>
        <div class="spark-layer" id="spark-wheel" style="left:91.5%; top:56%;"></div>
      </div>

      <div class="touch-field" id="touchField">
        <button class="touch-btn" data-device="slide" style="left:9%; top:56%;">👆</button>
        <button class="touch-btn" data-device="swing" style="left:25.5%; top:56%;">👆</button>
        <button class="touch-btn" data-device="seesaw" style="left:42%; top:56%;">👆</button>
        <button class="touch-btn" data-device="carousel" style="left:58.5%; top:56%;">👆</button>
        <button class="touch-btn" data-device="numberpad" style="left:75%; top:56%;">👆</button>
        <button class="touch-btn" data-device="wheel" style="left:91.5%; top:56%;">👆</button>
      </div>
    </section>

    <!-- ===================== 밤의 마을 풍경 ===================== -->
    <section class="scene village-scene" id="sceneVillage">
      <svg viewBox="0 0 800 220" class="village-svg" id="villageSvg">
        <rect x="0" y="0" width="800" height="220" class="sky" />
        <circle cx="700" cy="45" r="26" class="moon-sun" id="moonSun" />

        <g class="turbine" id="turbine1">
          <line x1="60" y1="200" x2="60" y2="90" class="pole" />
          <g class="blades" id="blades1">
            <line x1="60" y1="90" x2="60" y2="55" class="blade" />
            <line x1="60" y1="90" x2="90" y2="105" class="blade" />
            <line x1="60" y1="90" x2="30" y2="105" class="blade" />
          </g>
        </g>
        <g class="turbine" id="turbine2">
          <line x1="130" y1="200" x2="130" y2="100" class="pole" />
          <g class="blades" id="blades2">
            <line x1="130" y1="100" x2="130" y2="65" class="blade" />
            <line x1="130" y1="100" x2="160" y2="115" class="blade" />
            <line x1="130" y1="100" x2="100" y2="115" class="blade" />
          </g>
        </g>

        <g class="solar-roof">
          <polygon points="220,200 220,150 280,140 280,200" class="panel" />
          <line x1="220" y1="165" x2="280" y2="155" class="panel-line" />
          <line x1="220" y1="180" x2="280" y2="170" class="panel-line" />
        </g>

        <g class="house" id="house1">
          <rect x="330" y="150" width="70" height="50" class="house-body" />
          <polygon points="325,150 400,150 362,120" class="house-roof" />
          <rect x="345" y="165" width="16" height="16" class="window" id="win1" />
          <rect x="370" y="165" width="16" height="16" class="window" id="win2" />
        </g>
        <g class="house" id="house2">
          <rect x="430" y="140" width="80" height="60" class="house-body" />
          <polygon points="424,140 512,140 468,105" class="house-roof" />
          <rect x="450" y="158" width="18" height="18" class="window" id="win3" />
          <rect x="480" y="158" width="18" height="18" class="window" id="win4" />
        </g>
        <g class="house" id="house3">
          <rect x="540" y="155" width="65" height="45" class="house-body" />
          <polygon points="535,155 610,155 572,128" class="house-roof" />
          <rect x="555" y="170" width="15" height="15" class="window" id="win5" />
        </g>

        <g class="lamp" id="lamp1">
          <line x1="640" y1="200" x2="640" y2="130" class="lamp-pole" />
          <circle cx="640" cy="125" r="8" class="lamp-bulb" />
        </g>
        <g class="lamp" id="lamp2">
          <line x1="740" y1="200" x2="740" y2="130" class="lamp-pole" />
          <circle cx="740" cy="125" r="8" class="lamp-bulb" />
        </g>

        <g class="still">
          <polygon points="30,200 30,175 55,168 55,200" class="still-body" />
        </g>
        <circle cx="150" cy="192" r="9" class="water-roller" />

        <rect x="0" y="198" width="800" height="22" class="ground" />
      </svg>

      <p class="village-message" id="villageMessage">에너지 놀이터가 만든 전력으로 마을에 불이 켜졌습니다</p>
    </section>

  </div>

  <button class="reset-btn" id="resetBtn">처음부터 다시</button>

  <script src="script.js"></script>
</body>
</html>
